<!-- BEGIN: Interactive Feedback Scripts -->
<script data-purpose="audio-and-ui-interactions">
    document.addEventListener('DOMContentLoaded', () => {
      // Audio toggle button visual feedback
      const audioBtn = document.querySelector('[data-purpose="audio-toggle-btn"]');
      let audioEnabled = true;
      if (audioBtn) {
        audioBtn.addEventListener('click', () => {
          audioEnabled = !audioEnabled;
          const icon = audioBtn.querySelector('i');
          if (audioEnabled) {
            icon.className = 'fa-solid fa-music text-xs';
            audioBtn.classList.remove('opacity-60', 'text-stone-500');
            audioBtn.classList.add('text-amber-300');
          } else {
            icon.className = 'fa-solid fa-music-slash text-xs';
            audioBtn.classList.add('opacity-60', 'text-stone-500');
            audioBtn.classList.remove('text-amber-300');
          }
        });
      }

      // Exit button confirmation mock
      const exitBtn = document.querySelector('[data-purpose="menu-btn-exit"]');
      if (exitBtn) {
        exitBtn.addEventListener('click', () => {
          const confirmed = confirm('Bạn có chắc muốn tạm dừng phiên pha chế và thoát game?');
          if (confirmed) {
            console.log('User exited game simulation.');
          }
        });
      }
    });
  </script>
<!-- END: Interactive Feedback Scripts -->
